# Pipeline de slg_website — FU-05, criterios 2 y 4.
#
# La regla que gobierna este archivo: el pipeline FALLA, no avisa. Un gate que
# solo imprime un aviso es un gate que nadie lee (R-26).
#
# Cada freno tiene su prueba negativa en `npm run check:brakes`, que corre aquí
# mismo: un script que nunca se ha visto en rojo no se acepta como gate verde.

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Un push nuevo cancela la ejecución anterior de la misma rama: gastar minutos
# en verificar un commit ya superado no ayuda a nadie.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # R-20 y criterio 2: ningún despliegue llega a `main` sin haber pasado por
  # staging. Se comprueba que el commit que entra en `main` ya existe en
  # `develop` — es decir, que estuvo publicado en staging antes.
  # ──────────────────────────────────────────────────────────────────────────
  guarda-staging:
    name: Guarda · main solo recibe lo que pasó por staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: El commit ya estuvo en develop
        run: |
          git fetch origin develop --depth=0 2>/dev/null || git fetch origin develop
          if git merge-base --is-ancestor "${{ github.sha }}" origin/develop; then
            echo "✓ ${{ github.sha }} está contenido en develop: pasó por staging."
          else
            echo "✗ ${{ github.sha }} NO está en develop." >&2
            echo "  R-20: producción solo recibe lo que staging ya sirvió." >&2
            echo "  Lleva el cambio a develop, verifícalo en staging y vuelve a mezclar." >&2
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Los frenos que no necesitan base de datos.
  # ──────────────────────────────────────────────────────────────────────────
  gates:
    name: Gates · contenido, secretos, entorno, JS y cabeceras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos y los cinco scripts de contenido (FU-03, FU-01)
        run: npm run check:content

      # En `main` los marcadores están PROHIBIDOS; en develop/staging el brief
      # los EXIGE allí donde falta un dato. Por eso el estricto va aparte.
      - name: Cero [PENDIENTE] en main
        if: github.ref == 'refs/heads/main'
        run: npm run check:pending -- --strict

      - name: Análisis de secretos (capa propia)
        run: npm run check:secrets

      - name: .env.example completo y sin valores
        run: npm run check:env

      # El fallo que este paso impide ya ocurrió: tres migraciones escritas a
      # mano, en el repositorio, y sin declarar en el journal. drizzle-kit solo
      # aplica lo declarado, así que el despliegue habría creado las tablas SIN
      # row level security y sin decir nada.
      - name: Toda migración está declarada en el journal
        run: npm run check:migrations

      # Criterio 1 de FU-06 y de FU-08: cero lógica de identidad fuera de
      # lib/auth/, cero transporte de correo fuera de lib/mail/.
      - name: Fronteras de los módulos encapsulados
        run: npm run check:fronteras

      # Criterios 2 y 5 de FU-09: nadie lista un bucket, y cero documentos
      # gated en control de versiones. El repositorio es público.
      - name: Archivos — sin listado de buckets ni entregables versionados
        run: npm run check:archivos

      # La matriz B.3 entera —15 acciones × 4 roles, más los seis alcances—
      # sin base de datos: es tabla de permisos, no estado.
      - name: Matriz B.3
        run: npm run test:permisos

      - name: Compilación autocontenida
        run: npm run build:standalone

      - name: Presupuesto de JS inicial (gate D1)
        run: npm run check:js-budget

      - name: Cabeceras de seguridad y compuerta de staging, sobre el servidor real
        run: npm run check:runtime

      # Criterio 5: cada freno se ve en ROJO por el motivo esperado.
      - name: Prueba negativa de los seis frenos
        run: npm run check:brakes

  # ──────────────────────────────────────────────────────────────────────────
  # Segunda capa de análisis de secretos. El repositorio es PÚBLICO.
  # ──────────────────────────────────────────────────────────────────────────
  secretos:
    name: Gates · escáner de secretos dedicado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ──────────────────────────────────────────────────────────────────────────
  # Migraciones, aislamiento entre empresas y contratos del esquema (FU-04).
  # ──────────────────────────────────────────────────────────────────────────
  datos:
    name: Datos · migraciones y aislamiento entre empresas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slg
          POSTGRES_DB: slg
          # Base de datos efímera, en localhost, que vive lo que dura el job.
          # `trust` evita tener que escribir una contraseña en un archivo de un
          # repositorio PÚBLICO — y evita también que el análisis de secretos
          # tenga que aprender a distinguir cuáles son de mentira.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U slg -d slg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Rol DUEÑO: migraciones y semilla. Nunca sirve peticiones.
      DATABASE_URL_MIGRATIONS: postgresql://slg@127.0.0.1:5432/slg
      # Rol de APLICACIÓN: sin BYPASSRLS y sin ser dueño. La primera
      # comprobación de test:isolation falla si alguien apunta esto al dueño,
      # porque con el dueño las políticas de fila no se aplican y todo el
      # aislamiento entre empresas sería decorativo (hallazgo de FU-04).
      DATABASE_URL: postgresql://slg_app@127.0.0.1:5432/slg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `test:acceso` habla con el servidor real por HTTP, como un navegador:
      # necesita la salida autocontenida construida.
      - name: Compilación autocontenida (la necesita test:acceso)
        env:
          BETTER_AUTH_SECRET: solo-para-compilar-en-ci
        run: npm run build:standalone

      - name: Migraciones, con el rol dueño
        run: npm run db:migrate

      - name: Datos de ejemplo
        run: npm run db:seed

      - name: Aislamiento, contratos, autorización, correo, invitaciones y acceso
        run: npm run test:db
