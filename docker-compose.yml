# Entorno de desarrollo local de slg_website.
#
# Es el borrador del servicio `slg-db` que correrá en Easypanel (§5.1 Operación),
# no un montaje desechable: misma versión mayor de PostgreSQL, mismo nombre de
# servicio, misma forma de pasar credenciales.
#
# Puerto 5434 a propósito: en esta máquina el 5432 lo ocupa la base de datos del
# CRM y el 5433 otro proyecto. Levantar esto NUNCA debe interferir con ellos.
#
# Las credenciales llegan por variables de entorno desde `.env`, que está
# ignorado por git. El repositorio es público: aquí no se escribe ningún valor.

services:
  slg-db:
    image: postgres:16
    container_name: slg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - slg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Captadores SMTP locales · FU-08 · OPCIONALES ────────────────────────────
  # `npm run test:email` NO depende de esto: usa un captador EN PROCESO
  # (scripts/email/fake-smtp-server.ts), sin Docker. Estos dos son solo para
  # inspección manual con navegador (web UI de mailpit en :18025/:18026) si
  # Ricardo quiere VER un correo de prueba renderizado. No son "el proveedor"
  # (Resend, D-22): son un destino de pruebas para el adaptador SMTP estándar.
  slg-mail-a:
    image: axllent/mailpit:v1.22
    container_name: slg-mail-a
    restart: unless-stopped
    ports:
      - "127.0.0.1:10250:1025"
      - "127.0.0.1:18025:8025"

  slg-mail-b:
    image: axllent/mailpit:v1.22
    container_name: slg-mail-b
    restart: unless-stopped
    ports:
      - "127.0.0.1:10251:1025"
      - "127.0.0.1:18026:8025"

volumes:
  slg-db-data:
